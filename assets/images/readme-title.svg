<svg xmlns="http://www.w3.org/2000/svg" width="640" height="130" viewBox="0 0 640 130" role="img" aria-label="ResumeTemplate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
